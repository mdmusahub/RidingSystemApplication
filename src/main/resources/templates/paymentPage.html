<!DOCTYPE html>
<html>
<head>
    <title>Ride Payment Test</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #4b79a1, #283e51);
            font-family: 'Poppins', sans-serif;
            color: white;
            height: 100vh;
            overflow: hidden;
        }
        .card-box {
            width: 450px;
            margin: 120px auto;
            padding: 40px 35px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            backdrop-filter: blur(9px);
            box-shadow: 0px 0px 25px rgba(0,0,0,0.4);
        }
        h2 {
            font-size: 30px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
            color: #ffdd57;
        }
        #payBtn {
            width: 100%;
            font-size: 20px;
            font-weight: bold;
            padding: 12px;
            border-radius: 50px;
            background: #ff5f6d !important;
            border: none;
            transition: 0.3s;
        }
        #payBtn:hover {
            background: #ffc371 !important;
            color: black !important;
            transform: scale(1.05);
        }
    </style>

</head>
<body>

<div class="card-box">
    <h2>Ride Payment Portal</h2>
    <p class="text-center mb-4">Enter Ride ID when prompted to continue payment securely.</p>

    <button class="btn btn-danger" id="payBtn">Pay Now</button>

    <p class="text-center mt-4" style="font-size:14px; opacity:0.8;">
        Secure payment powered by Razorpay
    </p>
</div>

<script>
    document.getElementById("payBtn").onclick = async function () {
        const rideId = prompt("Enter Ride ID for Payment:");
        if (!rideId) return alert("Ride ID required");

        // create order
        const createResp = await fetch(`http://localhost:8080/api/payment/createOrder?rideId=${rideId}`,
        { method: 'POST' });
        const orderId = await createResp.text();
        console.log("ORDER ->", orderId);

        // get amount & key for UI (optional helper)
        const rideResp = await fetch(`http://localhost:8080/api/payment/get-ride/${rideId}`);
        const rideJson = await rideResp.json();

        const amount = rideJson.amount * 100;
        const key = rideJson.key;

        const options = {
            key: key,
            amount: amount,
            currency: "INR",
            name: "Ride Payment",
            order_id: orderId,
            handler: async function(response) {
                try {
                const verify = await fetch("http://localhost:8080/api/payment/success", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        rideId,
                        orderId: response.razorpay_order_id,
                        paymentId: response.razorpay_payment_id,
                        signature: response.razorpay_signature
                    })
                });

                const msg = await verify.json();
                alert(JSON.stringify(msg));

                if(msg.success === true){
                    window.location.href = "/payment/successPage";
                }
            } catch (e) {
                alert("Payment verification failed");
            }
             }
        };

        new Razorpay(options).open();
    };
</script>

</body>
</html>
